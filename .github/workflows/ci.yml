name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: axiom
          POSTGRES_PASSWORD: axiom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U axiom -d postgres"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Verify generated OpenAPI contract
        run: npm run openapi:check

      - name: Verify production-readiness record
        run: npm run release:readiness-verify

      - name: Run tests
        run: npm test

      - name: Run integration tests
        run: npm run test:integration

      - name: Run deterministic quality suites
        run: npm run test:quality

      - name: Scan production sources for committed secrets
        run: npm run security:secrets

      - name: Audit production dependencies
        run: npm run security:dependencies

      - name: Validate migration metadata
        run: npm run db:check

      - name: Run PostgreSQL migration tests
        run: npm run test:database
        env:
          DATABASE_TEST_ADMIN_URL: postgresql://axiom:axiom@127.0.0.1:5432/postgres
          DATABASE_RESTORE_TOOLS_REQUIRED: "true"

      - name: Build
        run: npm run build
        env:
          AXIOM_API_AUTH_REQUIRED: "false"
