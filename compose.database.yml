services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: axiom_lumen
      POSTGRES_USER: axiom
      POSTGRES_PASSWORD: axiom
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axiom -d axiom_lumen"]
      interval: 2s
      timeout: 2s
      retries: 15
    volumes:
      - axiom_lumen_postgres:/var/lib/postgresql/data

volumes:
  axiom_lumen_postgres:
